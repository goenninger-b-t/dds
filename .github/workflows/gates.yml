name: Gates

# THERE WAS NO CI. Until this file, the ONLY workflow in the repo was publish-wiki.yml — it runs
# scripts/publish-wiki.sh and nothing else. No build, no tests, no gates. Every quality gate ran ONLY when a
# human happened to run it locally.
#
# That is not a theoretical hole: `main` did not compile from a clean cache for TWO DAYS while `make test`
# reported 563/563 (a stale forward declaim; the fasl cache hid it and ql:quickload muffled the warning).
# Nothing would have caught it, because nothing was running.
#
# The operating contract asserted CI enforcement that did not exist — "the CI hotpath-purity-gate enforces
# this" (§4) and "no reader conditionals outside dds-pal/ (CI lint enforces this)" (§10). Both were false.
# This workflow makes them true.
#
# WHAT THIS RUNS: every gate that needs nothing but SBCL.
# WHAT IT DOES NOT RUN, AND WHY — stated LOUDLY, never silently skipped (a gate that cannot run must not
# report success). The targets are SBCL and AllegroCL (ADR 0118 withdrew Clasp):
#   * ALLEGROCL — commercially licensed; it cannot be installed in a hosted runner until the CI licence
#                 question is settled. Every AllegroCL leg is therefore a HUMAN STEP, run locally:
#                 `make gate-build LISP=./scripts/with-allegro.sh` + `make test LISP=./scripts/with-allegro.sh`.
#   * INTEROP   — needs licensed RTI Connext + a Fast DDS build. Human step: `make interop`.
#   * WIRE      — needs tshark; installed below, so it DOES run.
# The last step COMPUTES what was not covered rather than reciting a fixed list: every step that passes
# records what it covered, and the required set is derived from the Makefile's gate-* targets plus the
# per-Lisp build/test/corpus/fuzz legs. Anything required and not recorded is printed as NOT COVERED.
#
# 2026-07-29 — WHY THIS FILE WAS REBUILT. CI was red on ONE test and, because the runner stopped at the
# first failure, that made it blind to everything after it. MD-E2E-P2-VIEW (fixed since, 4e642de) was 135th of 553, so 418 TESTS
# HAD NEVER RUN IN CI AT ALL — the whole loan-write, keyed-FlatData, durability, XTypes-lookup and
# DDS-Security suites among them. The run reported nothing about them, and the local run reported "623
# passed" from a DIFFERENT platform, so the gap was invisible from both ends.
#
# run-all-tests now RECORDS each failure and CONTINUES, prints a true "N passed, M FAILED, T total" with
# every failure named, and still SIGNALS at the end so the job goes red. Falsified deliberately: with a
# failure injected into the FIRST test, 590 tests still ran, the summary read "622 passed, 1 FAILED,
# 623 total", and make exited 2.
#
# OPENSSL 3.5 (WP-0.8, ADR 0123) — ON (WP-0.10 step 2, ADR 0128). The DARE / DDS-Security arms need
# OpenSSL >= 3.5 and ubuntu-latest ships 3.0. The steps below build the pinned release with
# scripts/build-openssl.sh (SHA-256 + OpenPGP verified), cache the install keyed on the pinned version AND hash
# read out of that script, and export ONLY DDS_DARE_LIBCRYPTO through $GITHUB_ENV. The switch
# NEODDS_CI_OPENSSL35 is set 'on' below (workflow-level env): the governing plan
# (docs/plans/2026-10-03-sbcl-allegro-full-ok.md, WP-0.10) turns it on in the same commit as ADR 0122 step 2.
# Do not turn it off: under step 2 a run against the system OpenSSL 3.0 FAILS `make test` (about 106
# :openssl-pqc skip events, none of them in the empty SBCL skip baseline), which is the point.
#
# `make test` EXITS WITH THE ADR 0120 RATCHET'S VERDICT (ADR 0128): a failure or a skip event not listed in
# test/baseline-sbcl.txt / test/skip-baseline-sbcl.txt fails the step; a listed one is printed as KNOWN. Both
# SBCL baselines are empty, so for SBCL this is "0 FAILED, 0 skip events, 0 leaked threads".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEODDS_CI_OPENSSL35: 'on'

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL, Quicklisp, tshark
        run: |
          set -euo pipefail
          sudo apt-get update
          # libsqlite3 for the CL `sqlite` binding, libffi for cffi.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sbcl tshark libsqlite3-dev libffi-dev
          curl -sSLo /tmp/ql.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load /tmp/ql.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(ql-util:without-prompting (ql:add-to-init-file))'
          # The repo's launchers expect quicklisp at ~/quicklisp/setup.lisp (they load it explicitly).
          test -f "$HOME/quicklisp/setup.lisp"

      - name: Preload third-party dependencies
        # Fetch the deps ONCE with quickload, which resolves them TRANSITIVELY from the .asd files.
        # Do NOT hand-list them: my first attempt did, guessed :ironclad/:usocket (not used), MISSED :chipz
        # and :sqlite, and CI failed on "Component chipz not found". A hand-written list always rots.
        # quickload's warning-muffling is fine here — it is fetching OTHER people's code. Our OWN systems are
        # then rebuilt from a CLEARED cache by gate-build via asdf:load-system, which is what makes a compile
        # WARNING fail the build.
        run: |
          set -euo pipefail
          ./scripts/with-sbcl.sh \
            --eval '(ql:quickload :dds-tests :silent t)' \
            --eval '(ql:quickload :dds-bench :silent t)' \
            --eval '(uiop:quit 0)'

      - name: OpenSSL 3.5 pin (read from scripts/build-openssl.sh)
        id: osslpin
        if: ${{ env.NEODDS_CI_OPENSSL35 == 'on' }}
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^OPENSSL_VERSION="\(.*\)"$/\1/p' scripts/build-openssl.sh)"
          sha="$(sed -n 's/^OPENSSL_SHA256="\(.*\)"$/\1/p' scripts/build-openssl.sh)"
          test -n "$ver" && test -n "$sha"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "prefix=$HOME/.local/opt/openssl-3.5" >> "$GITHUB_OUTPUT"

      - name: Cache OpenSSL 3.5 install
        if: ${{ env.NEODDS_CI_OPENSSL35 == 'on' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.osslpin.outputs.prefix }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ steps.osslpin.outputs.version }}-${{ steps.osslpin.outputs.sha256 }}

      - name: Build OpenSSL 3.5 (no-op on a cache hit) and export DDS_DARE_LIBCRYPTO only
        if: ${{ env.NEODDS_CI_OPENSSL35 == 'on' }}
        run: |
          set -euo pipefail
          # Cache miss: a full verified build (SHA-256 mandatory; OpenPGP required here). Cache hit: the
          # stamp matches and the script exits at once.
          DDS_OPENSSL_REQUIRE_PGP=1 ./scripts/build-openssl.sh
          . scripts/openssl-env.sh
          echo "DDS_DARE_LIBCRYPTO=$DDS_DARE_LIBCRYPTO" >> "$GITHUB_ENV"
          echo "openssl35@sbcl" >> "$RUNNER_TEMP/ci-covered"

      # THE build gate: clears the fasl cache, rebuilds from scratch, and falsifies itself.
      # `make build` is incremental and can pass on a tree that does not compile — that is the whole point.
      - name: gate-build (clean-cache rebuild + self-falsification)
        run: |
          make gate-build LISP=./scripts/with-sbcl.sh
          echo "gate-build" >> "$RUNNER_TEMP/ci-covered"
          echo "build@sbcl" >> "$RUNNER_TEMP/ci-covered"

      # Bounded so a hang gives a FAST RED instead of burning the 60-minute job timeout. With OpenSSL 3.5 the
      # ~100 DARE / DDS-Security arms that used to skip now run, so the bound is wider than before.
      # The verdict is the ADR 0120 ratchet's (ADR 0128); the log is kept as an artifact when the job fails.
      - name: test (SBCL, ADR 0120 ratchet, OpenSSL 3.5)
        timeout-minutes: 25
        run: |
          make test LISP=./scripts/with-sbcl.sh TEST_LOG_DIR="$RUNNER_TEMP"
          echo "test@sbcl" >> "$RUNNER_TEMP/ci-covered"

      - name: corpus (XCDR byte-exact vs Connext's WIRE bytes)
        run: |
          make corpus LISP=./scripts/with-sbcl.sh TEST_LOG_DIR="$RUNNER_TEMP"
          echo "corpus@sbcl" >> "$RUNNER_TEMP/ci-covered"

      - name: gate-hotpath (CLOS purity + allocation purity; prints the NFR-MEM debt)
        run: |
          make gate-hotpath
          echo "gate-hotpath" >> "$RUNNER_TEMP/ci-covered"

      - name: gate-types (every defun ftype-declared)
        run: |
          make gate-types
          echo "gate-types" >> "$RUNNER_TEMP/ci-covered"

      - name: gate-pal (no reader conditionals outside dds-pal/)
        run: |
          make gate-pal
          echo "gate-pal" >> "$RUNNER_TEMP/ci-covered"

      # gate-mem creates two DDS participants on loopback — same container-networking exposure as `test`.
      - name: gate-nocond (no conditions in the hot path; boundary handlers intact)
        run: |
          make gate-nocond
          echo "gate-nocond" >> "$RUNNER_TEMP/ci-covered"

      - name: gate-mem (NFR-MEM allocation ratchet)
        timeout-minutes: 10
        run: |
          make gate-mem
          echo "gate-mem" >> "$RUNNER_TEMP/ci-covered"

      # ADR 0095. Asserts what `make mem` was long credited with and never checked: that ONE process arena
      # sized by *static-arena-bytes* bounds hot-path static memory, that a live participant charges it,
      # that a create/delete cycle RETURNS the charge, and that high-water < budget. Falsifies itself first.
      - name: gate-arena (FR-PF-7 static-memory budget)
        timeout-minutes: 10
        run: |
          make gate-arena
          echo "gate-arena" >> "$RUNNER_TEMP/ci-covered"

      - name: fuzz (CDR/RTPS parser fuzzers, prod + safety-0)
        run: |
          make fuzz LISP=./scripts/with-sbcl.sh TEST_LOG_DIR="$RUNNER_TEMP"
          echo "fuzz@sbcl" >> "$RUNNER_TEMP/ci-covered"

      - name: wire (validate emitted RTPS against the tshark RTPS dissector)
        run: |
          make wire
          echo "wire" >> "$RUNNER_TEMP/ci-covered"

      # test, corpus and fuzz each write a fresh mktemp log, neodds-<stem>.XXXXXX.log (scripts/judged-run.sh,
      # ADR 0128); when any step failed, all of them are kept.
      - name: keep the judged-run logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neodds-test-sbcl-log
          path: ${{ runner.temp }}/neodds-*.log
          if-no-files-found: ignore

      - name: Declare what CI did NOT cover (computed)
        if: always()
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/ci-covered"
          # REQUIRED is derived, not hand-listed: every gate-* target in the Makefile, the per-Lisp legs for
          # both supported Lisps (ADR 0118), wire, and interop.
          mapfile -t gates < <(grep -oE '^gate-[a-z0-9-]+:' Makefile | tr -d ':' | sort -u)
          required=("${gates[@]}")
          for lisp in sbcl allegro; do
            for leg in build test corpus fuzz; do required+=("${leg}@${lisp}"); done
          done
          required+=(wire interop openssl35@sbcl)
          missing=()
          for r in "${required[@]}"; do
            grep -qxF "$r" "$RUNNER_TEMP/ci-covered" || missing+=("$r")
          done
          echo "Covered:     $(sort -u "$RUNNER_TEMP/ci-covered" | tr '\n' ' ')"
          echo "Not covered: ${missing[*]:-(none)}"
          for m in "${missing[@]}"; do echo "::warning::NOT COVERED: $m"; done
          if printf '%s\n' "${missing[@]}" | grep -q '@allegro$'; then
            echo "::warning::ALLEGROCL NOT RUN — CI cannot run AllegroCL yet (licensed). Human step: make gate-build LISP=./scripts/with-allegro.sh && make test LISP=./scripts/with-allegro.sh"
          fi
          if printf '%s\n' "${missing[@]}" | grep -qx 'openssl35@sbcl'; then
            echo "::warning::OPENSSL 3.5 NOT PROVISIONED — the pinned build step did not complete (ADR 0123); the DARE / DDS-Security arms did not run against it"
          fi
          if printf '%s\n' "${missing[@]}" | grep -qx 'interop'; then
            echo "::warning::INTEROP NOT RUN — needs licensed RTI Connext + Fast DDS. Human step: make interop"
          fi
