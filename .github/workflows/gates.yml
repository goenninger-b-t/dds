name: Gates

# THERE WAS NO CI. Until this file, the ONLY workflow in the repo was publish-wiki.yml — it runs
# scripts/publish-wiki.sh and nothing else. No build, no tests, no gates. Every quality gate ran ONLY when a
# human happened to run it locally.
#
# That is not a theoretical hole: `main` did not compile from a clean cache for TWO DAYS while `make test`
# reported 563/563 (a stale forward declaim; the fasl cache hid it and ql:quickload muffled the warning).
# Nothing would have caught it, because nothing was running.
#
# The operating contract asserted CI enforcement that did not exist — "the CI hotpath-purity-gate enforces
# this" (§4) and "no reader conditionals outside dds-pal/ (CI lint enforces this)" (§10). Both were false.
# This workflow makes them true.
#
# WHAT THIS RUNS: every gate that needs nothing but SBCL.
# WHAT IT DOES NOT RUN, AND WHY — stated LOUDLY, never silently skipped (a gate that cannot run must not
# report success):
#   * CLASP   — not installable in a hosted runner in reasonable time (it is a source build). The standing
#               rule is that Clasp AND SBCL must BOTH validate; CI covers SBCL only, so the CLASP LEG
#               REMAINS A HUMAN STEP: `make test-clasp` + `make gate-build LISP=./scripts/with-clasp.sh`.
#   * INTEROP — needs licensed RTI Connext + a Fast DDS build. Human step: `make interop`.
#   * WIRE    — needs tshark; installed below, so it DOES run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL, Quicklisp, tshark
        run: |
          set -euo pipefail
          sudo apt-get update
          # libsqlite3 for the CL `sqlite` binding, libffi for cffi.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sbcl tshark libsqlite3-dev libffi-dev
          curl -sSLo /tmp/ql.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load /tmp/ql.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(ql-util:without-prompting (ql:add-to-init-file))'
          # The repo's launchers expect quicklisp at ~/quicklisp/setup.lisp (they load it explicitly).
          test -f "$HOME/quicklisp/setup.lisp"

      - name: Preload third-party dependencies
        # Fetch the deps ONCE with quickload, which resolves them TRANSITIVELY from the .asd files.
        # Do NOT hand-list them: my first attempt did, guessed :ironclad/:usocket (not used), MISSED :chipz
        # and :sqlite, and CI failed on "Component chipz not found". A hand-written list always rots.
        # quickload's warning-muffling is fine here — it is fetching OTHER people's code. Our OWN systems are
        # then rebuilt from a CLEARED cache by gate-build via asdf:load-system, which is what makes a compile
        # WARNING fail the build.
        run: |
          set -euo pipefail
          ./scripts/with-sbcl.sh \
            --eval '(ql:quickload :dds-tests :silent t)' \
            --eval '(ql:quickload :dds-bench :silent t)' \
            --eval '(uiop:quit 0)'

      # THE build gate: clears the fasl cache, rebuilds from scratch, and falsifies itself.
      # `make build` is incremental and can pass on a tree that does not compile — that is the whole point.
      - name: gate-build (clean-cache rebuild + self-falsification)
        run: make gate-build LISP=./scripts/with-sbcl.sh

      # ⚠️ THE SUITE HANGS ON THE RUNNER (see the note at the bottom). Bounded so CI gives a FAST RED
      # instead of burning the 60-minute job timeout — a gate that hangs is as useless as one that lies.
      # DIAGNOSTIC (temporary): the suite hangs on the runner the first time a test calls create-participant.
      # Isolate it — print the runner's multicast capability, then create + delete ONE participant under a hard
      # timeout, tracing each step. This tells us WHERE it blocks instead of guessing.
      - name: Diagnose DDS participant startup on the runner
        timeout-minutes: 4
        run: |
          set -uo pipefail
          echo "=== interfaces / multicast routes ==="
          ip -brief addr || true
          ip maddr show || true
          ip route show || true
          echo "=== create + delete ONE participant (30 s hard cap) ==="
          timeout 40 ./scripts/with-sbcl.sh \
            --eval '(asdf:load-system :dds)' \
            --eval '(progn
                      (dolist (sym (list (quote dds.disc:announce-participant-dispose)
                                         (quote dds.disc:stop-node)))
                        (let ((orig (symbol-function sym)) (name sym))
                          (setf (symbol-function sym)
                                (lambda (&rest a)
                                  (format t "~&  -> ENTER ~a~%" name) (finish-output)
                                  (multiple-value-prog1 (apply orig a)
                                    (format t "~&  <- LEAVE ~a~%" name) (finish-output))))))
                      (format t "~&STEP 1: creating~%") (finish-output)
                      (let ((p (dds.dcps:create-participant :domain 0)))
                        (format t "~&STEP 2: created OK; now deleting~%") (finish-output)
                        (dds.dcps:delete-participant p)
                        (format t "~&STEP 3: deleted OK~%") (finish-output)))' \
            --eval '(uiop:quit 0)'
          rc=$?
          echo "participant probe exit=$rc  (124 = TIMED OUT -> it blocks in create-participant)"
          exit 0   # diagnostic only: never fail the job on this step

      - name: test (SBCL)
        timeout-minutes: 12
        run: make test LISP=./scripts/with-sbcl.sh

      - name: corpus (XCDR byte-exact vs Connext's WIRE bytes)
        run: make corpus LISP=./scripts/with-sbcl.sh

      - name: gate-hotpath (CLOS purity + allocation purity; prints the NFR-MEM debt)
        run: make gate-hotpath

      - name: gate-types (every defun ftype-declared)
        run: make gate-types

      - name: gate-pal (no reader conditionals outside dds-pal/)
        run: make gate-pal

      # gate-mem creates two DDS participants on loopback — same container-networking exposure as `test`.
      - name: gate-mem (NFR-MEM allocation ratchet)
        timeout-minutes: 10
        run: make gate-mem

      - name: fuzz (CDR/RTPS parser fuzzers, prod + safety-0)
        run: make fuzz LISP=./scripts/with-sbcl.sh

      - name: wire (validate emitted RTPS against the tshark RTPS dissector)
        run: make wire

      - name: Declare what CI did NOT cover
        if: always()
        run: |
          echo "::warning::CLASP NOT RUN — CI covers SBCL only. The standing rule is that BOTH must validate."
          echo "::warning::  Human step: make test-clasp && make gate-build LISP=./scripts/with-clasp.sh"
          echo "::warning::INTEROP NOT RUN — needs licensed RTI Connext + Fast DDS. Human step: make interop"

# OPEN: THE SUITE HANGS ON THE RUNNER.
#
# `make test` completes in ~40 s locally (566/566, macOS AND Linux-targeting code) but HANGS on
# ubuntu-latest — it ran >16 minutes before being cancelled. It is NOT a compile problem: gate-build (a
# clean-cache rebuild) passes, and the suite gets PAST the FlatData byte-exactness test that used to fail in
# one second, which is how we know the alloc-static zero-fill fix landed.
#
# Prime suspect: DDS discovery. The suite creates participants that join the SPDP multicast group
# (239.255.0.1:7400). A hosted runner container may have no multicast route, so discovery blocks forever
# rather than erroring. Next steps for whoever picks this up:
#   * find WHICH test hangs (run with a per-test timeout, or bisect the registry in echo-test.lisp);
#   * check whether the runner has a multicast route at all: `ip maddr show`, `ip route show`;
#   * if multicast is unavailable, the suite needs a loopback/unicast-peers mode for CI (the runners already
#     support :peers — see the Fast DDS interop recipe, which is loopback-whitelisted for the same reason).
# Until then CI is RED on `test` — which is CORRECT and must not be papered over. Do not disable the step.
